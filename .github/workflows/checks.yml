name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real application browser workflows
        env:
          PLAYWRIGHT_CHANNEL: chrome
          SPLIT_DB: /tmp/split-ui.sqlite
        run: |
          node --experimental-sqlite server/index.mjs > /tmp/split.log 2>&1 &
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: split-browser-review
          path: test-results
          retention-days: 7
