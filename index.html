<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Event expense tracker" />
    <meta name="theme-color" content="#f7f8f4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <title>Split | Event expense tracker</title>
    <script>
      try {
        const mode = localStorage.getItem('split-theme');
        if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
      } catch {}
    </script>
  </head>
  <body>
    <noscript>This tool requires JavaScript. Enable it to use the controls.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
